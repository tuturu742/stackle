<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stackle" />
    <meta name="theme-color" content="#bfe3f2" />
    <title>Stackle</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #bfe3f2;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* One big play button: iOS only starts sound from a tap, so the parent taps
         it once before play. No text. */
      #start {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.35);
        touch-action: none;
      }
      #start[hidden] {
        display: none;
      }
      #start button {
        width: 168px;
        height: 168px;
        border: none;
        border-radius: 50%;
        background: #8fcf7e;
        box-shadow: 0 8px 0 #7cbf6c;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 0 0 14px;
        cursor: pointer;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="start">
      <button type="button" aria-label="Play">
        <svg width="72" height="80" viewBox="0 0 72 80" aria-hidden="true">
          <path d="M8 6 L66 40 L8 74 Z" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
